name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Biome
        run: yarn biome:check

      - name: Typecheck
        run: yarn typecheck

      # No tests yet: the transition is native and visual, and the example is its check. Turbo finds no `test` script
      # and passes; a package that adds one runs here.
      - name: Test
        run: yarn test

      # Builds the package, packs it the way npm will receive it and type-checks real usage from a throwaway consumer.
      - name: Pack check
        run: yarn pack:check

  android:
    name: Android module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The module compiles inside the example's Gradle project, the way an app builds it.
      - name: Prebuild the example
        run: yarn workspace expo-zoom-transition-example expo prebuild --platform android --no-install

      - name: Compile the module
        working-directory: apps/example/android
        run: ./gradlew :hzblj-expo-zoom-transition:compileDebugKotlin --console=plain
